name: IndexNow ping

on:
  workflow_run:
    workflows:
      - pages-build-deployment
    types:
      - completed
  workflow_dispatch:
    inputs:
      after:
        description: Commit SHA on main; ping the range <after>..HEAD (ignored when all is true)
        required: false
        type: string
      all:
        description: Ping every <loc> in this repo's sitemap (one-off full ping)
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  # workflow_run cannot filter on the triggering run's conclusion, so a failed
  # Pages build still starts this workflow; the job-level if below skips work
  # instead of adding a second trigger type (keeps one workflow, one skipped job).
  ping:
    name: Notify IndexNow of changed URLs
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ((github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'dynamic') &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out deployed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'refs/heads/main' || github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Submit changed sitemap URLs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          INDEXNOW_AFTER: ${{ github.event.workflow_run.head_sha }}
          INDEXNOW_BEFORE: ${{ inputs.after }}
          INDEXNOW_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.all && '1' || '' }}
        run: python3 tools/indexnow.py --submit
